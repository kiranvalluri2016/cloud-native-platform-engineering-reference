[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-native-platform-engineering-reference"
version = "0.1.0"
description = "Local-only cloud-native platform engineering reference."
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
  "PyYAML==6.0.3",
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
