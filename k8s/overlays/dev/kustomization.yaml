apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-dev
resources:
  - ../../base
  - namespace.yaml
patches:
  - path: deployment-patch.yaml
  - path: hpa-patch.yaml
labels:
  - pairs:
      platform.example.io/environment: dev
    includeSelectors: false
    includeTemplates: true
